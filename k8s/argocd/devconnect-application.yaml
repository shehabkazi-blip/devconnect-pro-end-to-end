apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devconnect
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shehabkazi-blip/devconnect-pro-end-to-end.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: devconnect
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
